events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3002;
        server_name _;

        # WebSocket proxy untuk VNC stream
        location /websockify {
            proxy_pass http://mt5-real:5901/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Override defaults.json agar noVNC selalu menyambung ke port 3002 via path /websockify
        location /defaults.json {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            return 200 '{"path": "websockify"}';
        }

        # Static files noVNC (HTML, JS, CSS)
        location / {
            proxy_pass http://mt5-real:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

